<main id="main-content">
  {% if tags %}
  <nav class="tag-navigation" aria-label="Feed tags">
    <a href="{{ url_for('index', unread=1 if unread_only else None) }}" data-nav{% if not tag %} aria-current="page"{% endif %}>all</a>
    {% for choice in tags %}
    <span aria-hidden="true" class="tag-separator">|</span>
    <a href="{{ url_for('index', tag=choice, unread=1 if unread_only else None) }}" data-nav{% if choice == tag %} aria-current="page"{% endif %}>{{ choice }}</a>
    {% endfor %}
  </nav>
  {% endif %}
  <nav class="view-navigation" aria-label="Post views">
    <a href="{{ url_for('index', tag=tag) }}" data-nav{% if not unread_only %} aria-current="page"{% endif %}>Recent</a>
    <a href="{{ url_for('index', tag=tag, unread=1) }}" data-nav{% if unread_only %} aria-current="page"{% endif %}>Unread</a>
    <a href="/archive">Read</a>
  </nav>
  <h2 tabindex="-1">{{ tag or ('Unread' if unread_only else 'Recent') }}</h2>
  <ul class="post-list" id="post-list"{% if unread_only %} data-read-filter="unread"{% endif %}>
    {% include "posts_fragment.html" %}
  </ul>
  {% if more_url %}<a href="{{ more_url }}" data-show-more>Show more</a>{% endif %}
</main>
